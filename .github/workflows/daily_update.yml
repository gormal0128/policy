name: Daily Policy Update

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 openai lxml

      - name: Run Scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python policy_scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Auto-Updater"
          git config --global user.email "actions@github.com"
          git add policy_db.json index.html
          git commit -m "Update Dashboard: $(date)" || echo "No changes to commit"
          git push
